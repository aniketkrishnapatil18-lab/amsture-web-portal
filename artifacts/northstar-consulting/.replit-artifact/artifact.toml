kind = "web"
previewPath = "/"
title = "Northstar Consulting"
description = "A premium IT services and AI solutions website for businesses seeking clearer operations, stronger digital experiences, and measurable growth."
version = "1.0.0"
id = "artifacts/northstar-consulting"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24887

[services.development]
run = "pnpm --filter @workspace/northstar-consulting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/northstar-consulting", "run", "build" ]
serve = "static"
publicDir = "artifacts/northstar-consulting/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24887"
BASE_PATH = "/"
